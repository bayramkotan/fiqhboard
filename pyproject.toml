[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fiqhboard"
dynamic = ["version"]
description = "Comparative fiqh of the four Sunni schools: side-by-side matrices, every ruling with its source and evidence, a glossary and decision diagrams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bayram Kotan" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

keywords = ["fiqh", "islamic law", "madhhab", "hanafi", "maliki", "shafii", "hanbali", "islamic studies"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Arabic",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Religion",
]

[project.urls]
Homepage = "https://github.com/bayramkotan/fiqhboard"
Repository = "https://github.com/bayramkotan/fiqhboard"
Issues = "https://github.com/bayramkotan/fiqhboard/issues"

[project.scripts]
fiqhboard = "fiqhboard.main:main"
fqb = "fiqhboard.main:main"

[project.gui-scripts]
fiqhboard-gui = "fiqhboard.main:gui_main"

[tool.hatch.version]
path = "src/fiqhboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fiqhboard"]

[tool.hatch.build.targets.sdist]
exclude = ["FiqhBoard_Handoff.md", "FIQHBOARD_TODO.md", "js/"]
